<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clasifica · Laboratorio de hosts — Group 2</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect rx='15' width='64' height='64' fill='%233157ed'/%3E%3Cpath d='M18 20h28v24H18z' fill='none' stroke='white' stroke-width='5'/%3E%3Cpath d='M25 29h14M32 22v20' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  /*
   * Dirección visual: laboratorio claro. Cards redondeadas sobre papel frío,
   * un azul de marca que manda, y el dato numérico siempre en monoespaciada.
   * Todo color vive en tokens: el modo oscuro solo los reasigna, nunca redefine
   * reglas — así una card nueva hereda los dos temas sin tocarla.
   */
  :root{
    --ink:#16213c; --muted:#6d7890; --soft:#8a93a5;
    --paper:#f5f7fb; --surface:#ffffff; --field:#fbfcff;
    --line:#dce2ef; --line-2:#eef1f8;
    --blue:#3157ed; --blue-ink:#ffffff; --sky:#e9efff; --blue-deep:#2646c9;
    --lime:#dff66c; --lime-ink:#304100;
    --green:#237457; --green-soft:#e5f7ef;
    --red:#c8393b; --red-soft:#fff1f1;
    --warn:#a8600c;
    --night:#121c36; --night-ink:#ffffff; --night-muted:#a9b5ce;
    --sh-s:0 8px 25px #2030640c;
    --sh-m:0 12px 40px #25345e0d;
    --sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ink:#e7ecf8; --muted:#8e99b1; --soft:#7b8598;
      --paper:#0c111e; --surface:#141b2d; --field:#101827;
      --line:#242e47; --line-2:#1b2337;
      --blue:#6d8cff; --blue-ink:#0b1020; --sky:#18213c; --blue-deep:#5878f0;
      --lime:#cbe555; --lime-ink:#242f00;
      --green:#57c391; --green-soft:#10281f;
      --red:#e8706e; --red-soft:#2b1518;
      --warn:#dda94f;
      --night:#090e1b; --night-ink:#eef2fb; --night-muted:#94a1bd;
      --sh-s:0 8px 25px #00000040; --sh-m:0 12px 40px #00000059;
    }
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink);
    font-family:var(--sans); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased}
  .wrap{max-width:1240px; margin:0 auto; padding:24px 32px 70px}
  @media (max-width:850px){ .wrap{padding:15px 15px 50px} }
  h1,h2,h3{margin:0; letter-spacing:-.02em}
  p{margin:0}
  a{color:inherit}

  /* ── barra superior ─────────────────────────────────────────────────────── */
  /* Flota al hacer scroll: con cuatro secciones largas, volver al menu obligaba a
     subir hasta arriba. `sticky` y no `fixed` para que siga ocupando su sitio en el
     flujo y no tape el contenido al cargar la pagina.
     El fondo es opaco a proposito: translucido con blur, los numeros de latencia que
     pasan por debajo se leen a traves de la barra. */
  .nav{display:flex; align-items:center; justify-content:space-between; gap:12px;
    background:var(--surface); border:1px solid var(--line); padding:11px 14px 11px 18px;
    border-radius:16px; box-shadow:var(--sh-s); flex-wrap:wrap;
    position:sticky; top:12px; z-index:60}
  /* El indicador de variantes activas es informacion en vivo: al flotar, deja de
     hacer falta bajar a la seccion de servidores para saber si algo esta corriendo. */
  @media (max-width:850px){ .nav{top:8px; padding:9px 12px} }
  .brand{font-size:20px; font-weight:900; letter-spacing:-.03em; line-height:1.1}
  .brand b{color:var(--blue)}
  .brand small{display:block; font-size:10px; font-weight:700; letter-spacing:.11em;
    text-transform:uppercase; color:var(--soft); margin-top:2px}
  .tabs{display:flex; gap:5px}
  .tabs a{text-decoration:none; color:var(--muted); font-weight:650; font-size:14px;
    padding:9px 12px; border-radius:9px}
  .tabs a:hover,.tabs a:focus-visible{background:var(--sky); color:var(--blue)}
  .status{font-weight:750; font-size:13px; color:var(--green); background:var(--green-soft);
    padding:8px 12px; border-radius:10px; white-space:nowrap}
  .status.cero{color:var(--muted); background:var(--line-2)}
  @media (max-width:850px){ .tabs{display:none} }

  /* ── hero ───────────────────────────────────────────────────────────────── */
  .hero{display:grid; grid-template-columns:1.1fr .9fr; gap:22px; margin:22px 0}
  @media (max-width:980px){ .hero{grid-template-columns:1fr} }
  /* La card de estímulo es más alta que el texto del hero; centrar reparte el
     aire en vez de dejarlo todo abajo. */
  .intro{background:var(--blue); color:#fff; border-radius:24px; padding:34px;
    position:relative; overflow:hidden;
    display:flex; flex-direction:column; justify-content:center}
  .intro:after{content:"01"; position:absolute; right:18px; bottom:-35px; font-size:150px;
    font-weight:900; color:#ffffff10; line-height:1; pointer-events:none}
  .kicker{font-size:12px; text-transform:uppercase; letter-spacing:.17em; color:var(--lime); font-weight:850}
  .intro h1{font-size:clamp(28px,3.4vw,40px); line-height:1.05; letter-spacing:-.05em; margin:13px 0}
  .intro p{max-width:56ch; color:#dfe5ff; font-size:16px; position:relative}
  .intro details{position:relative}
  .intro summary{color:var(--lime)}
  .intro .porque{color:#dfe5ff; border-left-color:#ffffff33}

  /* ── secciones y cards ──────────────────────────────────────────────────── */
  .section{background:var(--surface); border:1px solid var(--line); border-radius:20px;
    padding:24px; margin:18px 0;
    /* Alto de la barra flotante + su separacion: sin esto, un clic en el menu
       deja el titulo de la seccion escondido detras de la propia barra. */
    scroll-margin-top:104px}
  .test{background:var(--surface); border:1px solid var(--line); border-radius:24px;
    padding:25px; box-shadow:var(--sh-m)}
  h2{font-size:19px}
  .sub{color:var(--muted); margin:5px 0 0; font-size:14px}
  .sectionhead{display:flex; justify-content:space-between; gap:15px; align-items:center; flex-wrap:wrap}
  .sectionhead .acciones{display:flex; gap:8px; flex-wrap:wrap}

  /* ── controles ──────────────────────────────────────────────────────────── */
  .control{margin:12px 0}
  .control label,.lbl{display:block; font-size:11px; font-weight:850; letter-spacing:.1em;
    margin-bottom:6px; color:var(--muted); text-transform:uppercase}
  input,select{width:100%; border:1px solid var(--line); border-radius:11px; background:var(--field);
    padding:12px; color:var(--ink); font:14px var(--mono)}
  select{appearance:none; -webkit-appearance:none; cursor:pointer; padding-right:34px;
    background-image:linear-gradient(45deg,transparent 50%,var(--blue) 50%),linear-gradient(135deg,var(--blue) 50%,transparent 50%);
    background-position:calc(100% - 19px) calc(50% - 2px),calc(100% - 14px) calc(50% - 2px);
    background-size:5px 5px,5px 5px; background-repeat:no-repeat}
  select:hover,input:hover{border-color:var(--blue)}
  optgroup{font-family:var(--sans); font-weight:700; color:var(--muted)}
  option{font-family:var(--mono); color:var(--ink)}
  input.mal{border-color:var(--red); background:var(--red-soft); color:var(--red)}
  .btn{border:0; border-radius:11px; padding:11px 15px; font-family:var(--sans); font-weight:800;
    font-size:14px; background:var(--blue); color:var(--blue-ink); cursor:pointer;
    transition:background .12s,opacity .12s}
  .btn:hover:not(:disabled){background:var(--blue-deep)}
  .btn:disabled{opacity:.42; cursor:not-allowed}
  .btn.alt{background:var(--sky); color:var(--blue)}
  .btn.ghost{background:transparent; color:var(--muted); border:1px solid var(--line)}
  .btn.ghost:hover:not(:disabled){background:var(--line-2); color:var(--ink)}
  .btn.sm{padding:8px 11px; font-size:12.5px; border-radius:9px}
  .btn.full{width:100%}
  :focus-visible{outline:2px solid var(--blue); outline-offset:2px}

  /* ── plegables ──────────────────────────────────────────────────────────── */
  details{margin-top:12px}
  summary{font-size:13px; font-weight:700; color:var(--blue); cursor:pointer; list-style:none;
    display:inline-flex; align-items:center; gap:6px}
  summary::-webkit-details-marker{display:none}
  summary::before{content:"\25B8"; font-size:.85em}
  details[open] summary::before{content:"\25BE"}
  .porque{font-size:13px; color:var(--muted); line-height:1.6; margin-top:10px; padding-left:12px;
    border-left:2px solid var(--line)}
  .porque p{margin:0 0 7px} .porque p:last-child{margin:0}

  /* ── servidores ─────────────────────────────────────────────────────────── */
  .servers{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:10px; margin-top:18px}
  .server{border:1px solid var(--line); border-radius:14px; padding:14px; display:flex;
    flex-direction:column; gap:8px; background:var(--surface)}
  .server.active{box-shadow:inset 0 3px var(--blue)}
  .server.pending{border-style:dashed; color:var(--soft)}
  .server h3{font-size:14px; font-weight:800}
  .server .code{font:12px var(--mono); color:var(--muted); line-height:1.45}
  .server .btn{margin-top:auto}
  .pill{display:inline-flex; align-self:flex-start; padding:4px 7px; border-radius:7px;
    background:var(--green-soft); color:var(--green); font-size:10px; font-weight:900; letter-spacing:.04em}
  .pill.off,.pending .pill{background:var(--line-2); color:var(--soft)}
  .pill.ext{background:var(--red-soft); color:var(--red)}
  .pill.desc{background:var(--line-2); color:var(--muted)}

  /* ── estímulo ───────────────────────────────────────────────────────────── */
  .answer{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;
    margin-top:15px; padding:12px 14px; background:var(--green-soft); color:var(--green);
    border-radius:11px; font-weight:750}
  .answer.ext{background:var(--red-soft); color:var(--red)}
  .answer.desc{background:var(--line-2); color:var(--muted)}
  .answer b{font-size:17px; letter-spacing:.02em}
  .answer .dir{font:12px var(--mono); opacity:.85; font-weight:500}
  .dual{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:10px}
  .dual > div{border:1px solid var(--line); border-radius:13px; padding:13px 14px; background:var(--field)}
  .dual .v{display:block; font:600 21px/1.2 var(--mono); margin-top:4px; font-variant-numeric:tabular-nums}
  .dual .sistema .v{color:var(--green)}
  .dual small{display:block; font-size:11px; color:var(--muted); line-height:1.4; margin-top:5px}
  .rango{margin-top:10px; font:12px var(--mono); color:var(--muted)}
  .rango b{color:var(--ink)}
  @media (max-width:420px){ .dual{grid-template-columns:1fr} }

  /* ── medición ───────────────────────────────────────────────────────────── */
  .measure{display:grid; grid-template-columns:280px 1fr; gap:20px; margin-top:18px}
  @media (max-width:850px){ .measure{grid-template-columns:1fr} }
  .measureaside{background:var(--night); color:var(--night-ink); border-radius:16px; padding:20px}
  .measureaside > div:first-child{font-size:13px; color:var(--night-muted); font-weight:700}
  .score{font:900 46px/1 var(--mono); letter-spacing:-.06em; margin:12px 0}
  .score small{font-size:16px; color:var(--night-muted); font-weight:600}
  .pass{display:inline-block; background:var(--lime); color:var(--lime-ink); padding:7px 10px;
    border-radius:8px; font-weight:900; font-size:12.5px}
  .pass.no{background:var(--red); color:#fff}
  .aside-nota{margin-top:14px; font:11.5px/1.5 var(--mono); color:var(--night-muted)}
  .stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:10px}
  .stat{background:var(--field); border:1px solid var(--line); border-radius:13px; padding:15px}
  .stat span{font-size:10px; color:var(--muted); font-weight:850; letter-spacing:.06em}
  .stat b{display:block; font:600 21px/1.2 var(--mono); margin-top:4px; font-variant-numeric:tabular-nums}
  .graf{grid-column:1/-1}

  /* ── listas ─────────────────────────────────────────────────────────────── */
  .rules{display:grid; grid-template-columns:1fr 1fr; gap:15px; margin-top:18px}
  @media (max-width:850px){ .rules{grid-template-columns:1fr} }
  .rule{border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column}
  .ruletitle{display:flex; justify-content:space-between; align-items:center; gap:8px;
    padding:12px 14px; font-weight:850; font-size:13.5px}
  .rule.white .ruletitle{background:var(--green-soft); color:var(--green)}
  .rule.black .ruletitle{background:var(--red-soft); color:var(--red)}
  .rrow{display:flex; gap:6px; align-items:center; padding:8px 10px; border-top:1px solid var(--line)}
  .rrow input{font-size:13px; padding:8px 9px; border-radius:9px}
  .rrow input.n{flex:2 1 50%} .rrow input.i{flex:1 1 120px}
  .rrow .btn{flex:0 0 auto}
  .rvacia{padding:14px; font:13px var(--mono); color:var(--muted); border-top:1px solid var(--line)}
  .radd{padding:10px; border-top:1px solid var(--line); margin-top:auto}
  .desc-zona{margin-top:15px; border:1px dashed var(--line); border-radius:13px; padding:12px 14px;
    display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:13px; color:var(--muted)}
  .cap{height:6px; background:var(--line-2); border-radius:4px; overflow:hidden; margin-top:15px}
  .cap > i{display:block; height:100%; background:var(--blue); transition:width .18s}
  .cap.full > i{background:var(--red)}

  /* ── historial ──────────────────────────────────────────────────────────── */
  .filtros{display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; margin-top:16px}
  .filtros .control{margin:0; min-width:135px}
  .resumen{display:flex; gap:18px; flex-wrap:wrap; margin-top:14px; font-size:13px; color:var(--muted)}
  .resumen b{color:var(--ink); font-family:var(--mono); font-variant-numeric:tabular-nums}
  .tablabox{overflow-x:auto; margin-top:6px}
  .history{width:100%; border-collapse:collapse}
  .history th,.history td{text-align:left; padding:11px 12px; border-top:1px solid var(--line);
    white-space:nowrap; font-size:13px}
  .history th{font-size:11px; color:var(--muted); font-weight:850; letter-spacing:.06em; border-top:0}
  .history td{font-family:var(--mono)}
  .history td.host{color:var(--ink); white-space:normal}
  .history td.t,.history td.seq{color:var(--muted)}
  .history td.num{text-align:right; font-variant-numeric:tabular-nums}
  .history td.num.s{color:var(--green); font-weight:600}
  .history td.num.w{color:var(--muted)}
  .history tbody tr:hover{background:var(--field)}

  /* ── avisos ─────────────────────────────────────────────────────────────── */
  .aviso{font:13px/1.55 var(--mono); padding:11px 13px; border-radius:11px; margin-top:12px; white-space:pre-wrap}
  .a-err{color:var(--red); background:var(--red-soft)}
  .a-ok{color:var(--green); background:var(--green-soft)}
  .a-info{color:var(--muted); background:var(--line-2)}
  footer{margin-top:26px; font-size:12.5px; color:var(--muted); text-align:center; line-height:1.7}
  footer code{font-family:var(--mono); background:var(--sky); color:var(--blue); padding:2px 6px; border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="raiz"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
/*
 * Interfaz del PLANO DE CONTROL.
 *
 * React 18 desde CDN, sin paso de compilación: no hay npm, ni Webpack, ni
 * node_modules. Se usa React.createElement con alias cortos en vez de JSX para
 * no depender de Babel en el navegador — una dependencia menos que pueda fallar
 * en medio de la demostración frente al curso.
 *
 * Esta página NO mide el sistema. El único cronómetro que corre aquí se mide a
 * sí mismo, y está a propósito: al lado del número real del plano de datos,
 * muestra cuánto añade la web. Ese contraste es el argumento del proyecto.
 */
(function () {
  'use strict';
  var h = React.createElement;
  function T(t) { return function () {
    return React.createElement.apply(null, [t].concat(Array.prototype.slice.call(arguments)));
  }; }
  var div = T('div'), p = T('p'), span = T('span'), b = T('button'), h1 = T('h1'), h2 = T('h2'),
      h3 = T('h3'), inp = T('input'), sel = T('select'), opt = T('option'), og = T('optgroup'),
      tbl = T('table'), thead = T('thead'), tbody = T('tbody'), tr = T('tr'), th = T('th'), td = T('td'),
      sec = T('section'), hdr = T('header'), nav = T('nav'), ftr = T('footer'), lbl = T('label'),
      small = T('small'), code = T('code'), art = T('article'), a = T('a'),
      svg = T('svg'), rect = T('rect'), line = T('line'), text = T('text'), form = T('form'),
      det = T('details'), sum = T('summary'), ital = T('i'), bold = T('b');
  var us = React.useState, ue = React.useEffect, uc = React.useCallback, ur = React.useRef;

  var OTRO = '__otro__';

  /* ── helpers ──────────────────────────────────────────────────────────── */
  function fmt(ns) {
    if (ns === null || ns === undefined) return '—';
    var v = ns / 1000;
    if (v >= 1000) return (v / 1000).toLocaleString('es', {maximumFractionDigits: 2}) + ' ms';
    if (v >= 10) return v.toLocaleString('es', {maximumFractionDigits: 1}) + ' µs';
    if (v >= 1) return v.toLocaleString('es', {maximumFractionDigits: 2}) + ' µs';
    return ns.toLocaleString('es') + ' ns';
  }
  // El número grande del panel oscuro se parte en valor y unidad.
  function partes(ns) {
    var t = fmt(ns), i = t.lastIndexOf(' ');
    return i < 0 ? [t, ''] : [t.slice(0, i), t.slice(i + 1)];
  }
  function miles(n) { return (n || 0).toLocaleString('es'); }
  function hora(iso) {
    if (!iso) return '—';
    var m = /T(\d{2}:\d{2}:\d{2}\.\d{1,6})/.exec(iso);
    return m ? m[1].slice(0, 12) : iso;
  }
  function mediana(xs) {
    if (!xs.length) return null;
    var o = xs.slice().sort(function (x, y) { return x - y; });
    return o[Math.floor(o.length / 2)];
  }
  function api(ruta, opciones) {
    return fetch(ruta, Object.assign({headers: {'Content-Type': 'application/json'}}, opciones || {}))
      .then(function (r) { return r.json(); })
      // «Failed to fetch» es lo que dice el navegador, no lo que necesita saber quien
      // lo lee: casi siempre el servidor se bajó (Ctrl-C, terminal cerrada) y la
      // pestaña siguió abierta. El mensaje dice qué hacer, como doctor.py.
      .catch(function (e) {
        return {ok: false, error: 'Sin conexión con el plano de control. Casi siempre es que el ' +
          'servidor se bajó y esta pestaña quedó abierta: volvé a arrancarlo (./iniciar.sh en ' +
          'macOS o Linux, iniciar.cmd en Windows) y recargá. Si no arranca: python3 doctor.py. ' +
          '[' + e.message + ']'};
      });
  }
  function clasePill(v) { return v === 'LOCAL' ? '' : v === 'EXTERNO' ? 'ext' : 'desc'; }
  // toISOString() devuelve UTC; el servidor sella en hora local. Mezclar las dos
  // se lee como un salto de horas que no existe, así que el navegador sella con
  // el mismo formato y la misma zona que el servidor.
  function isoLocal(d) {
    var z = function (n, w) { return String(n).padStart(w || 2, '0'); };
    var off = -d.getTimezoneOffset(), sg = off >= 0 ? '+' : '-';
    off = Math.abs(off);
    return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + 'T' +
           z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds()) + '.' +
           z(d.getMilliseconds(), 3) + '000' + sg + z(Math.floor(off / 60)) + ':' + z(off % 60);
  }
  /*
   * El nombre lleva quién, qué, con qué filtro y cuándo — en ese orden, y con la
   * fecha en ISO para que el explorador los ordene solos:
   *     group2-estimulos-B-2026-09-14_2057.csv
   * Un archivo suelto en Descargas tiene que decir de dónde salió sin abrirlo.
   */
  function nombreArchivo(ext, filtro) {
    var d = new Date(), z = function (n) { return (n < 10 ? '0' : '') + n; };
    return 'group2-estimulos-' + (filtro || 'todas') + '-' +
           d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate()) + '_' +
           z(d.getHours()) + z(d.getMinutes()) + '.' + ext;
  }
  // La página la sirve el propio servidor.py en localhost: no hay sandbox que
  // bloquee la descarga, así que un Blob + <a download> alcanza. Sin librerías.
  function descargar(nombre, texto, tipo) {
    var url = URL.createObjectURL(new Blob([texto], {type: tipo + ';charset=utf-8'}));
    var el = document.createElement('a');

  /* ═══════════ Historial ═══════════ */
  /*
   * Columnas del CSV. Una por cada cosa que la tabla de la interfaz muestra, con

   * en Excel. Sin columnas tecnicas —la frontera F1 y el overhead del control se

     resolver mal. Ver la nota al pie de la cabecera. */

  var COLS = [
    ['n',           function (e) { return e.seq; }],
    ['fecha',       function (e) { return fecha(e.ts_nav_envio || e.ts_control_recibe); }],
    ['hora_inicio', function (e) { return horaTexto(e.ts_nav_envio || e.ts_control_recibe); }],
    ['hora_fin',    function (e) { return horaTexto(e.ts_nav_recibe || e.ts_control_responde); }],
    ['variante',    function (e) { return e.nombre_variante || e.variante; }],

      celda('  _ms') + SEP + celda('MILIsegundos - milesima de segundo') + SEP + celda('1 ms = 1000 us'),
      celda('  referencia') + SEP + celda('el objetivo del enunciado es 1 ms = 1000 us'),
      '',

      celda('  sistema_us') + SEP + celda('lo que tarda el SISTEMA, frontera F1 - es la UNICA medicion del reto'),
      celda('  web_ms') + SEP + celda('lo que anade el navegador (HTTP + JSON + React) - solo contraste'),
      celda('  hora_inicio / hora_fin') + SEP + celda('reloj de PARED: dicen cuando paso, no cuanto tardo'),

    var hijos = [];
    for (var d = 0; d <= 7; d++) {
      var x = X0 + d * 12 * w;
      hijos.push(line({key: 'g' + d, x1: x, y1: 6, x2: x, y2: Y1, stroke: 'var(--line)', strokeWidth: 1}));
      hijos.push(text({key: 't' + d, x: x, y: H - 5, textAnchor: 'middle',
        fontFamily: 'IBM Plex Mono, monospace', fontSize: 9, fill: 'var(--muted)'}, dec[d]));
    }
    var xu = X0 + 60 * w;
    hijos.push(line({key: 'u', x1: xu, y1: 0, x2: xu, y2: Y1, stroke: 'var(--warn)', strokeWidth: 2, strokeDasharray: '4 3'}));
    hijos.push(text({key: 'ul', x: xu + 6, y: 10, fontFamily: 'Inter, sans-serif', fontSize: 10,

        height: hh, fill: 'var(--blue)', rx: 2}));

  }

    var sh = us(1), hilos = sh[0], setHilos = sh[1];
    var sr = us(null), res = sr[0], setRes = sr[1];
    var se = us(null), err = se[0], setErr = se[1];
    var sc = us(false), corr = sc[0], setCorr = sc[1];

    ue(function () {
      var hay = activos.some(function (v) { return v.id === variante; });
      if (!hay) setVariante(activos.length ? activos[0].id : '');
    }, [props.estado]);

    var vsel = activos.filter(function (v) { return v.id === variante; })[0];
    var admiteHilos = !vsel || vsel.concurrencia !== false;

    // Si se cambia a una variante que no admite concurrencia, el valor vuelve a 1.
    // Dejarlo en 8 y deshabilitar el control mostraria un numero que no es el que se
    // va a usar: la interfaz estaria mintiendo sobre lo que va a medir.
    ue(function () {
      if (!admiteHilos && hilos !== 1) setHilos(1);
    }, [admiteHilos]);

    function medir() {
      if (!variante) return;
      setCorr(true); setErr(null); setRes(null);
      // Recarga inmediata: el sondeo rapido solo arranca cuando el estado dice que hay
      // una medicion activa, y esperar al sondeo lento (4 s) dejaba el indicador en
      // blanco justo durante los primeros segundos, que es cuando se mira.
      if (props.recargar) props.recargar();
      api('/api/medir', {method: 'POST', body: JSON.stringify({variante: variante, iters: iters, hilos: hilos})})
        .then(function (r) { setCorr(false); if (!r.ok) setErr(r.error); else setRes(r); if (props.recargar) props.recargar(); });
    }
    var cumple = res && res.p999 < 1000000;
    var p50 = res ? partes(res.p50) : null;

    return sec({className: 'section', id: 'rendimiento'},
      h(Cabecera, {titulo: 'Medición de rendimiento',
                   sub: res
                     ? res.nombre + ' · ' + miles(res.n) + ' muestras · ' +
                       (hilos > 1 ? hilos + ' clientes concurrentes · ' : '1 cliente · ') +
                       miles(res.warmup) + ' warmup · ' + res.segundos + ' s'
                     : 'Lanza el cliente real de la variante: el mismo que produce el informe.'},
        b({className: 'btn', type: 'button', onClick: medir, disabled: corr || !activos.length},
          corr ? 'Midiendo…' : 'Ejecutar medición')),
      activos.length === 0
        ? div({className: 'aviso a-info'}, 'Arrancá al menos una variante para poder medir.')
        : div({className: 'filtros'},
            div({className: 'control', style: {flex: '0 1 260px'}},
              lbl({htmlFor: 'mv'}, 'Variante'),
              sel({id: 'mv', value: variante, onChange: function (e) { setVariante(e.target.value); }},
                activos.map(function (v) { return opt({key: v.id, value: v.id}, v.nombre); }))),
            div({className: 'control', style: {flex: '0 1 220px'}},
              lbl({htmlFor: 'mi'}, 'Iteraciones'),
              sel({id: 'mi', value: iters, onChange: function (e) { setIters(parseInt(e.target.value, 10)); }},
                opt({value: 10000}, '10 000 · rápido'),
                opt({value: 50000}, '50 000'),
                opt({value: 200000}, '200 000'),
                opt({value: 1000000}, '1 000 000 · como el informe'))),
            div({className: 'control', style: {flex: '0 1 240px'}},
              lbl({htmlFor: 'mh'}, 'Clientes concurrentes'),
              sel({id: 'mh', value: hilos, disabled: !admiteHilos,
                   onChange: function (e) { setHilos(parseInt(e.target.value, 10)); }},
                admiteHilos
                  ? [opt({key: 1, value: 1}, '1 · como el informe'),
                     opt({key: 2, value: 2}, '2'),
                     opt({key: 4, value: 4}, '4'),
                     opt({key: 8, value: 8}, '8 · carga alta')]
                  : opt({value: 1}, '1 · esta variante no admite más')))),
      // No se oculta el control: que aparezca deshabilitado CON su razon enseña algo
      // del sistema. Ocultarlo dejaria al usuario creyendo que se nos olvidó.
      !admiteHilos && vsel && vsel.porque_no
        ? h(Porque, {titulo: 'por qué ' + vsel.id + ' no admite clientes concurrentes'},
            vsel.porque_no.split('\n\n').map(function (t, i) { return p({key: i}, t); }))
        : null,
      corr ? div({className: 'aviso a-info'},
        (function () {
          /* Lo que se muestra NO lo mide el navegador: son los contadores que el
             cliente medidor emite entre lotes, fuera del tramo cronometrado. */
          var g = props.estado.progreso || {};
          if (!g.activa || !g.lotes_total) {
            return 'Corriendo el cliente real. El navegador espera, no participa.';
          }
          var pct = Math.round(100 * g.lotes / g.lotes_total);
          return g.hilos + ' de ' + g.hilos_total + ' hilos activos · lote ' +
                 g.lotes + ' de ' + g.lotes_total + ' (' + pct + '%) · ' +
                 'el navegador observa, no mide.';
        })()) : null,
      err ? div({className: 'aviso a-err'}, err) : null,
      res ? div({className: 'measure'},
        div({className: 'measureaside'},
          div(null, 'Mediana P50'),
          div({className: 'score'}, p50[0], ' ', small(null, p50[1])),
          span({className: 'pass' + (cumple ? '' : ' no')},
            (cumple ? '✓ Cumple' : '✗ No cumple') + ' objetivo 1 ms'),
          p({className: 'aside-nota'},
            'El umbral se evalúa contra el p99,9, no contra la media: ' +
            (res.sobre1ms === 0 ? 'ninguna muestra por encima de 1 ms.'
                                : miles(res.sobre1ms) + ' muestras por encima de 1 ms.'))),
        div({className: 'stats'},
          div({className: 'stat'}, span(null, 'P99'), bold(null, fmt(res.p99))),
          div({className: 'stat'}, span(null, 'P99,9'), bold(null, fmt(res.p999))),
          div({className: 'stat'}, span(null, 'MÁXIMO'), bold(null, fmt(res.max))),
          div({className: 'stat'}, span(null, 'MÍNIMO'), bold(null, fmt(res.min))),
          div({className: 'graf'}, h(MiniHist, {hist: res.hist}))))
        : null,
      h(Porque, {titulo: 'por qué el p99,9 y no el promedio'},
        p(null, 'El promedio esconde la cola, y la cola es lo que decide el cumplimiento. Un sistema ' +
          'con mediana de 20 µs y un p99,9 de 3 ms no cumple: falla una de cada mil veces.')));
  }

  /* ═══════════ App ═══════════ */
  function App() {
    var se = us(null), estado = se[0], setEstado = se[1];
    var sa = us(null), aviso = sa[0], setAviso = sa[1];
    var sl = us([]), log = sl[0], setLog = sl[1];

    var recargar = uc(function () {
      api('/api/estado').then(function (r) {
        if (r && r.variantes) setEstado(r);
        else setAviso({txt: (r && r.error) || 'El plano de control no responde.'});
      });
    }, []);

    // El log se siembra del buffer del servidor: así sobrevive a un F5. Después
    // cada estímulo se agrega en caliente, sin volver a pedir la lista entera.
    ue(function () {
      recargar();
      api('/api/historial').then(function (r) {
        if (r && r.ok) setLog(r.historial.slice().reverse());
      });
      var t = setInterval(recargar, 4000);
      return function () { clearInterval(t); };
    }, [recargar]);

    // Mientras hay una medicion en curso se sondea mas seguido: 4 s es un buen ritmo
    // para el estado general, pero convierte una barra de progreso en un reloj parado.
    // Esto son peticiones al PLANO DE CONTROL; no tocan el plano de datos ni la
    // medicion, que corre en otro proceso con su propio cronometro.
    ue(function () {
      if (!estado || !estado.progreso || !estado.progreso.activa) return;
      var t = setInterval(recargar, 700);
      return function () { clearInterval(t); };
    }, [estado && estado.progreso && estado.progreso.activa, recargar]);

    var anotar = uc(function (e) { setLog(function (xs) { return [e].concat(xs); }); }, []);
    var limpiar = uc(function () {
      api('/api/historial', {method: 'POST', body: JSON.stringify({accion: 'limpiar'})})
        .then(function () { setLog([]); });
    }, []);

    if (!estado) {
      return div({className: 'wrap'},
        p({className: 'sub', style: {paddingTop: 70, textAlign: 'center'}},
          'Conectando con el plano de control…'));
    }

    var activos = estado.variantes.filter(function (v) { return v.corriendo; }).length;
    var reales = estado.variantes.filter(function (v) { return v.existe; }).length;

    return div({className: 'wrap'},
      hdr({className: 'nav'},
        div({className: 'brand'}, 'clasifica', bold(null, '.'),
          small(null, 'Group 2 · plano de control')),
        nav({className: 'tabs'},
          a({href: '#servidores'}, 'Servidores'),
          a({href: '#rendimiento'}, 'Rendimiento'),
          a({href: '#historial'}, 'Historial')),
        div({className: 'status' + (activos ? '' : ' cero')},
          '● ' + activos + ' de ' + reales + ' variantes activas')),

      aviso ? div({className: 'aviso a-err'}, aviso.txt) : null,

      sec({className: 'hero'},
        div({className: 'intro'},
          div({className: 'kicker'}, 'Módulo 1 · Reto de latencia mínima'),
          h1(null, 'Una vista clara para decisiones rápidas.'),
          p(null, 'Controlá el plano de datos, clasificá cada host y comprobá el rendimiento real ' +
            'de las variantes. Esta página es el plano de control, no el sistema.'),
          h(Porque, {titulo: 'la separación en dos planos'},
            p(null, 'El plano de datos —cliente y servidor, en C y en Python— es lo que el reto mide, ' +
              'y su cronómetro vive ahí dentro (frontera F1, ADR-001).'),
            p(null, 'Un navegador añade milisegundos; el sistema responde en microsegundos. Si ' +
              'midiéramos desde acá estaríamos midiendo el navegador.'))),
        h(Estimulo, {estado: estado, onLog: anotar})),

      h(Servidores, {estado: estado, recargar: recargar, avisar: setAviso}),
      h(Medicion, {estado: estado, recargar: recargar}),
      h(Historial, {entradas: log, limpiar: limpiar}),

      ftr(null,
        'Group 2 · Pontificia Universidad Javeriana Cali', h('br'),
        'El plano de datos vive en ', code(null, 'sistema/'), ' y se mide con ', code(null, './run.sh'),
        ' — los resultados del informe salen de ahí, nunca de esta página.'));
  }

  ReactDOM.createRoot(document.getElementById('raiz')).render(h(App));
})();
</script>
