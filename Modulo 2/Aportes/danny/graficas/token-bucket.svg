<title id="tb-t">Token bucket del API Gateway durante la prueba k6</title><desc id="tb-d">Fichas disponibles en el cubo con 35,7 req/s de llegada y rate 15. Con burst 2000 el cubo nunca se vacía. Con burst 500 se vacía a los 24,2 s y desde ahí las peticiones sobrantes reciben 429. El burst mínimo para 1000 peticiones es 580.</desc>
