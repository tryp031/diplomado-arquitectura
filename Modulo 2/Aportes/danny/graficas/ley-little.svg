<svg xmlns="http://www.w3.org/2000/svg" class="v" viewBox="0 0 640 340" role="img" aria-labelledby="ll-t ll-d" style="max-width:100%;height:auto">
<title id="ll-t">Ley de Little: instancias simultáneas según la duración de cada petición</title><desc id="ll-d">Con 35,7 req/s, la concurrencia es llegadas por duración. El límite de 10 instancias se cruza a los 0,28 s por petición.</desc>
<style>
.v{--sf:#FFFFFF;--t1:#0E2226;--t2:#3F5A61;--t3:#6E868C;--grid:#E1E9EA;--ax:#CDDADC;
  --s1:#2a78d6;--s2:#eb6834;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){.v{--sf:#101F22;--t1:#E3EBEC;--t2:#A5B9BE;--t3:#7C9399;
  --grid:#1A2E32;--ax:#233A3F;--s1:#3987e5;--s2:#d95926}}
.v .bg{fill:var(--sf)}
.v .grid{stroke:var(--grid);stroke-width:1}
.v .ax{stroke:var(--ax);stroke-width:1}
.v .tick{fill:var(--t3);font-size:11px}
.v .lab{fill:var(--t2);font-size:12px}
.v .ttl{fill:var(--t1);font-size:13px;font-weight:600}
.v .note{fill:var(--t2);font-size:11.5px}
.v .ref{stroke:var(--t3);stroke-width:1}
.v .l1{fill:none;stroke:var(--s1);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.v .l2{fill:none;stroke:var(--s2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.v .d1{fill:var(--s1);stroke:var(--sf);stroke-width:2}
.v .d2{fill:var(--s2);stroke:var(--sf);stroke-width:2}
.v .hit{fill:transparent}
</style>
<rect class="bg" width="640" height="340" rx="3"/>
<line class="grid" x1="64" x2="490" y1="288.0" y2="288.0"/>
<text class="tick" x="56" y="292.0" text-anchor="end">0</text>
<line class="grid" x1="64" x2="490" y1="205.3" y2="205.3"/>
<text class="tick" x="56" y="209.3" text-anchor="end">10</text>
<line class="grid" x1="64" x2="490" y1="122.7" y2="122.7"/>
<text class="tick" x="56" y="126.7" text-anchor="end">20</text>
<line class="grid" x1="64" x2="490" y1="40.0" y2="40.0"/>
<text class="tick" x="56" y="44.0" text-anchor="end">30</text>
<text class="tick" x="64.0" y="306" text-anchor="middle">0,0 s</text>
<text class="tick" x="170.5" y="306" text-anchor="middle">0,2 s</text>
<text class="tick" x="277.0" y="306" text-anchor="middle">0,4 s</text>
<text class="tick" x="383.5" y="306" text-anchor="middle">0,6 s</text>
<text class="tick" x="490.0" y="306" text-anchor="middle">0,8 s</text>
<line class="ax" x1="64" x2="490" y1="288" y2="288"/>
<text class="lab" x="277.0" y="330" text-anchor="middle">duración de cada petición</text>
<text class="lab" x="8" y="26">instancias simultáneas</text>
<path class="l1" d="M64.0,288.0 L490.0,52.0"/>
<line class="ref" x1="64" x2="490" y1="205.3" y2="205.3"/>
<text class="lab" x="498.0" y="209.3" text-anchor="start">límite: 10 instancias</text>
<g><title>k6 de referencia: 0,176 s × 35,7 req/s ≈ 6,3 instancias</title><circle class="hit" cx="157.7" cy="236.1" r="12"/><circle class="d1" cx="157.7" cy="236.1" r="5"/></g>
<g><title>corte: 0,280 s × 35,7 req/s ≈ 10,0 instancias</title><circle class="hit" cx="213.2" cy="205.3" r="12"/><circle class="d1" cx="213.2" cy="205.3" r="5"/></g>
<g><title>si el handler espera el correo: 0,500 s × 35,7 req/s ≈ 17,8 instancias</title><circle class="hit" cx="330.2" cy="140.5" r="12"/><circle class="d2" cx="330.2" cy="140.5" r="5"/></g>
<text class="note" x="167.7" y="252.1" text-anchor="start">0,176 s → 6,3</text>
<text class="note" x="203.2" y="195.3" text-anchor="end">0,28 s</text>
<text class="note" x="340.2" y="156.5" text-anchor="start">0,5 s → 17,8 (no alcanza)</text>
<text class="lab" x="498.0" y="56.0" text-anchor="start">35,7 req/s</text>
</svg>
